<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0e12" />
    <title>Offline</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #0d0e12; color: #edeef1; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
      main { max-width: 26rem; }
      h1 { margin: 0 0 8px; font-size: 1.25rem; }
      p { margin: 0 0 20px; color: #b0b5be; }
      button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; background: #1fc3ff; color: #0d0e12; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main data-testid="offline-page">
      <h1>You're offline</h1>
      <p>This page needs a connection. It reloads by itself when you're back online.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
