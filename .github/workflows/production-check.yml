# The live site checked as visitors see it, with nobody needed (docs/MONITORING.md → Production check):
#   after each production deployment  Vercel's "Production" deployment status (success)
#   every day                         at 05:37 UTC
#   by hand                           Actions → Production check → Run workflow
# scripts/live-check.mjs runs from GitHub's runner (which reaches the site) at 1440, 768 and 390 px:
# after a deployment, production must answer from the commit just deployed; /api/health is ok;
# signed-out and forged-session requests to member pages are turned away with no player data; the
# security headers are there; Riot's rules for a Personal key hold (no Riot API data on the public
# pages, Riot's required notice, /riot.txt served for the Developer Portal); the public pages load
# with no error, no sideways scroll and no serious axe violation (WCAG 2.1 AA). Before the live check, two protected
# audits re-derive Leaderboards' 30-day rule and the builds' thresholds on the server (scripts/production-audits.mjs;
# counts only, a job not deployed yet is a warning). The member pages are checked too once the
# verification account exists (Data jobs `verify-account`: a member with no player profile, its
# password worked out from VERIFY_ACCOUNT_SECRET, or from CRON_SECRET until that is set), or
# UNIIVERSE_VERIFY_USER / UNIIVERSE_VERIFY_PASSWORD are set.
# Database backups run, and are checked daily, in the private repository
# AscendMCMXCIX/uniiverse-backups (docs/BACKUPS.md). The daily run checks the database's size against its plan (DB_PLAN_MB, default 500: the free plan's 0.5 GB in decimal megabytes, the
# safer reading). From 80% it opens one database-size issue, once, with the remedy; from 95% the
# check fails too. On Mondays it runs the perf probe (about 6 MB of egress, docs/HOSTING_USAGE.md).
# A failure opens one issue labelled production-check (or comments on the open one) with what failed
# and the run's link; the next passing run closes it (scripts/report-issue.sh). About 3 Actions
# minutes a run (docs/CI_USAGE.md).
name: Production check

on:
  deployment_status:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      perf:
        description: "Also run the perf probe (reads about 6 MB from the production database)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check:
    # A successful production deployment only: never a preview, a pending or a failed deployment.
    if: github.event_name != 'deployment_status' || (github.event.deployment_status.state == 'success' && startsWith(github.event.deployment.environment, 'Production'))
    # On the job, not the workflow: every Preview deployment also sends a status event, and its run
    # (whose job is skipped) must not cancel a production check in progress.
    concurrency:
      group: production-check
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: ${{ secrets.APP_URL }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Settings
        run: |
          if [ -z "$APP_URL" ]; then echo "::error::The APP_URL secret is not set (it is also Data jobs' address of the site)."; exit 1; fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium

      - name: Live check (deployment, health, security, pages at three widths, accessibility)
        id: live
        env:
          UNIIVERSE_VERIFY_USER: ${{ secrets.UNIIVERSE_VERIFY_USER }}
          UNIIVERSE_VERIFY_PASSWORD: ${{ secrets.UNIIVERSE_VERIFY_PASSWORD }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERIFY_ACCOUNT_SECRET: ${{ secrets.VERIFY_ACCOUNT_SECRET }}
          SIGNED_IN_CHECKS: ${{ vars.SIGNED_IN_CHECKS || 'true' }}
          EXPECTED_COMMIT: ${{ github.event_name == 'deployment_status' && github.event.deployment.sha || '' }}
        run: |
          status=0
          # The member pages are opened as the verification account (docs/LIVE_VALIDATION.md): a member
          # with no player profile, kept by Data jobs `verify-account`. Its password is worked out
          # exactly as the app does (src/server/jobs/verify-account.ts), from the key the app names:
          # VERIFY_ACCOUNT_SECRET once the owner has set it, CRON_SECRET until then. It is masked at
          # once and never stored. Explicit UNIIVERSE_VERIFY_* secrets take precedence. A sign-in that
          # is lost fails the check (LIVE_REQUIRE_SIGN_IN), except by the owner's two off switches: the
          # repository variable SIGNED_IN_CHECKS=false, or the account deactivated in Admin.
          export LIVE_REQUIRE_SIGN_IN=1
          signin=verify
          if [ "$SIGNED_IN_CHECKS" = "false" ]; then
            signin=off
            unset UNIIVERSE_VERIFY_USER UNIIVERSE_VERIFY_PASSWORD LIVE_REQUIRE_SIGN_IN
          elif [ -n "$UNIIVERSE_VERIFY_USER" ]; then
            signin=explicit
          fi
          if [ -n "$CRON_SECRET" ]; then
            # The app keeps the account on every run, whoever signs in, so its password follows a
            # change of its key even while the off switch or explicit secrets are in use (created
            # once, then a no-op). Its answer is the account's state and the key's name, never a value.
            answer="$(curl --silent --max-time 60 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/jobs/verify-account" || true)"
            state="$(jq -r '.summary.state // "no answer"' <<<"$answer" 2>/dev/null || true)"
            # An app from before the key's name was answered derives from CRON_SECRET.
            key="$(jq -r '.summary.key // "CRON_SECRET"' <<<"$answer" 2>/dev/null || true)"
            # A key the server cannot use (its VERIFY_ACCOUNT_SECRET, or a CRON_SECRET too short to
            # derive from) is said as the app words it, a fixed sentence naming the rules; no other
            # error text of the job's is printed.
            problem="$(jq -r '.error // ""' <<<"$answer" 2>/dev/null || true)"
            case "$problem" in "VERIFY_ACCOUNT_SECRET "*|"CRON_SECRET "*) ;; *) problem="" ;; esac
            unset answer
            echo "verification account: ${state:-no answer}"
            if [ "$signin" != verify ]; then
              # Not signed in as `verify` this run: a key the server cannot use still fails the
              # check; any other answer is said, as a warning.
              if [ -n "$problem" ]; then
                echo "::error::The verification account's key cannot be used: $problem (docs/LIVE_VALIDATION.md)."
                echo "- FAIL: the verification account answered \"${state:-no answer}\" ($problem) (docs/LIVE_VALIDATION.md)." > verify-account.md
                status=1
              else
                case "$state" in
                  created|unchanged|password-updated|deactivated) ;;
                  *) echo "::warning::The verification account answered \"${state:-no answer}\"; this run does not sign in as it (docs/LIVE_VALIDATION.md)." ;;
                esac
              fi
            else
              case "$state" in
                created|unchanged|password-updated)
                  if [ "$key" = "VERIFY_ACCOUNT_SECRET" ]; then VERIFY_KEY="$VERIFY_ACCOUNT_SECRET"; else key=CRON_SECRET VERIFY_KEY="$CRON_SECRET"; fi
                  echo "verification account key: $key"
                  # The app refuses a padded VERIFY_ACCOUNT_SECRET of its own; the repository's copy is
                  # held to the same rule, by the same trim().
                  if [ "$key" = "VERIFY_ACCOUNT_SECRET" ] && ! VERIFY_KEY="$VERIFY_KEY" node -e 'const k = process.env.VERIFY_KEY || ""; process.exit(k !== "" && k.trim() === k ? 0 : 1)'; then
                    # The app uses VERIFY_ACCOUNT_SECRET, and this repository's copy is missing or has a
                    # space or line break at an end.
                    echo "::error::The app works the verification account's password out from VERIFY_ACCOUNT_SECRET, and this repository's VERIFY_ACCOUNT_SECRET secret is not set, or starts or ends with a space or line break (docs/LIVE_VALIDATION.md)."
                    echo "- FAIL: the repository secret VERIFY_ACCOUNT_SECRET, which the app uses for the verification account, is missing or has a space or line break at an end (docs/LIVE_VALIDATION.md)." > verify-account.md
                    status=1
                  else
                    UNIIVERSE_VERIFY_PASSWORD="$(VERIFY_KEY="$VERIFY_KEY" node -e 'process.stdout.write(require("node:crypto").createHmac("sha256", process.env.VERIFY_KEY).update("uniiverse:production-verification-account:v1", "utf8").digest("base64url"))')"
                    echo "::add-mask::$UNIIVERSE_VERIFY_PASSWORD"
                    export UNIIVERSE_VERIFY_USER=verify UNIIVERSE_VERIFY_PASSWORD
                  fi
                  unset VERIFY_KEY ;;
                deactivated)
                  unset LIVE_REQUIRE_SIGN_IN
                  echo "::warning::The verification account is deactivated (the owner's off switch), so the member pages stay pending (docs/LIVE_VALIDATION.md)." ;;
                *)
                  # Withdrawn (its access, profile or name changed), conflict, a key the server cannot
                  # use, or no answer.
                  echo "::error::The verification account is not available (${state:-no answer}${problem:+: $problem}), so the member pages could not be opened (docs/LIVE_VALIDATION.md)."
                  echo "- FAIL: the verification account answered \"${state:-no answer}\"${problem:+ ($problem)} (docs/LIVE_VALIDATION.md)." > verify-account.md
                  status=1 ;;
              esac
            fi
          fi
          # The production audits (scripts/production-audits.mjs, docs/LIVE_VALIDATION.md): Leaderboards'
          # 30-day rule and the builds' thresholds re-derived on the server, read for fixed counts only,
          # before the secret is unset. Their counts, and the builds audit's champions (unsealed and
          # masked at once), reach the live check through audits.env, deleted as soon as it is read.
          # A job the deployment does not have yet (404) is a warning; any other failure fails the check.
          node scripts/production-audits.mjs "$APP_URL" audits.md audits.env || status=1
          if [ -f audits.env ]; then set -a; . ./audits.env; set +a; rm -f audits.env; fi
          unset CRON_SECRET VERIFY_ACCOUNT_SECRET
          if [ -n "${UNIIVERSE_VERIFY_USER:-}" ]; then echo "signed_in=true" >> "$GITHUB_OUTPUT"; else echo "signed_in=false" >> "$GITHUB_OUTPUT"; fi
          node scripts/live-check.mjs "$APP_URL" live-check || status=$?
          if [ -f live-check/summary.md ]; then cat live-check/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f verify-account.md ]; then cat verify-account.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f audits.md ]; then cat audits.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit $status

      - name: Backups and database size
        id: data
        if: ${{ !cancelled() && github.event_name != 'deployment_status' }}
        env:
          GH_TOKEN: ${{ github.token }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DB_PLAN_MB: ${{ vars.DB_PLAN_MB || '500' }}
        run: |
          status=0
          {
            echo "## Backups and database size"
            # Database backups run in the private repository AscendMCMXCIX/uniiverse-backups, whose
            # daily Backup age check fails, and opens an issue there, when none passed within 8 days.
            echo "- info: database backups are checked in the private backup repository (docs/BACKUPS.md)."
            # The database's size against its plan, from the db-usage report (one small read).
            if [ -z "$CRON_SECRET" ]; then
              echo "- warning: the CRON_SECRET secret is not set, so the database's size was not read."
            else
              mb="$(curl --silent --max-time 120 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/jobs/db-usage" | jq -r '.summary.databaseMb // empty' 2>/dev/null || true)"
              if [ -z "$mb" ]; then echo "- FAIL: the database's size could not be read (db-usage)."; status=1
              else
                # db-usage reports binary megabytes (MiB); the plan is read in decimal ones.
                mb=$(( mb * 1048576 / 1000000 ))
                pct=$(( mb * 100 / DB_PLAN_MB ))
                echo "db_mb=$mb" >> "$GITHUB_OUTPUT"
                echo "db_pct=$pct" >> "$GITHUB_OUTPUT"
                if [ "$pct" -ge 95 ]; then echo "- FAIL: the database is $mb MB, $pct% of its $DB_PLAN_MB MB plan."; status=1
                elif [ "$pct" -ge 80 ]; then echo "- warning: the database is $mb MB, $pct% of its $DB_PLAN_MB MB plan (docs/HOSTING_USAGE.md)."; echo "::warning::The database is $mb MB, $pct% of its $DB_PLAN_MB MB plan."
                else echo "- ok: the database is $mb MB, $pct% of its $DB_PLAN_MB MB plan."; fi
              fi
            fi
          } > data-check.md
          cat data-check.md >> "$GITHUB_STEP_SUMMARY"
          cat data-check.md
          exit $status

      - name: Perf probe (Mondays, or when asked)
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.perf) }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$(date -u +%u)" != "1" ]; then echo "The perf probe runs on Mondays."; exit 0; fi
          if [ -z "$CRON_SECRET" ]; then echo "::warning::The CRON_SECRET secret is not set."; exit 0; fi
          if curl --fail --silent --show-error --max-time 290 -H "Authorization: Bearer $CRON_SECRET" -o perf-probe.json "$APP_URL/api/jobs/perf-probe"; then
            head -c 64000 perf-probe.json
          else
            echo "::warning::The perf probe did not answer (see this step's log); production's pages were checked above."
          fi

      # Artifacts of a public repository can be downloaded by anyone signed in to GitHub. Once the
      # verification account exists, the screenshots show member pages (the team's players, games
      # and ranks), so they are left out of the artifact unless the repository is private; the
      # report and summary (checks, counts and CSS selectors only) are still kept. An event whose
      # payload does not say the visibility counts as public.
      - name: Keep member-page screenshots out of a public artifact
        if: ${{ !cancelled() }}
        env:
          VISIBILITY: ${{ github.event.repository.visibility || 'unknown' }}
          # Signed in whether with the explicit secrets or the derived verification account (above).
          SIGNED_IN: ${{ steps.live.outputs.signed_in == 'true' }}
        run: |
          if [ "$SIGNED_IN" = "true" ] && [ "$VISIBILITY" != "private" ] && [ -d live-check ]; then
            removed=$(find live-check -name '*.png' -print -delete | wc -l)
            echo "::notice::$removed screenshot(s) left out of the artifact: the run opened member pages and the repository is $VISIBILITY."
          fi
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: production-check-${{ github.run_id }}
          path: live-check/
          retention-days: 14
          if-no-files-found: ignore

      # One issue while a check fails; closed by the next passing run.
      - name: Report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          LIVE: ${{ steps.live.outcome }}
          DATA: ${{ steps.data.outcome }}
          EVENT: ${{ github.event_name }}
          COMMIT: ${{ github.event.deployment.sha || github.sha }}
          DB_MB: ${{ steps.data.outputs.db_mb }}
          DB_PCT: ${{ steps.data.outputs.db_pct }}
          DB_PLAN_MB: ${{ vars.DB_PLAN_MB || '500' }}
        run: |
          # The database's size: one issue from 80% of the plan, opened once since it grows slowly
          # (about 2 MB a day), commented on from 95%, and closed once it is under 80% again.
          if [ -n "$DB_PCT" ]; then
            size_title="The database is nearing its plan's size limit"
            if [ "$DB_PCT" -ge 80 ]; then
              size_open="$(gh issue list --repo "$GITHUB_REPOSITORY" --label database-size --state open --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)"
              if [ "$DB_PCT" -ge 95 ] || [ -z "$size_open" ]; then
                printf '%s\n\n%s\n\n%s\n' \
                  "The database is $DB_MB MB, $DB_PCT% of its $DB_PLAN_MB MB plan ($RUN_URL). It grows by about 2 MB a day (docs/HOSTING_USAGE.md); at the plan's limit Supabase can make it read only." \
                  "What to do: Data jobs db-usage lists the largest tables. The next engineering session reads it and proposes what to reduce (docs/HOSTING_USAGE.md); deleting stored data, or a larger plan, needs your approval." \
                  "This issue closes by itself once the database is under 80% again." > size-issue.md
                scripts/report-issue.sh database-size "$size_title" fail size-issue.md
              fi
            else
              scripts/report-issue.sh database-size "$size_title" ok
            fi
          fi
          if [ "$LIVE" = "failure" ] || [ "$DATA" = "failure" ]; then
            {
              echo "The production check failed ($EVENT, commit ${COMMIT:0:7}): $RUN_URL"
              echo
              echo "Most failures need an engineering fix, not you: the next engineering session starts here. If the site is down for the team, the run's first failure says so."
              echo
              if [ -f live-check/summary.md ]; then sed -n '/^## Failures/,/^## Warnings/p' live-check/summary.md | sed '$d'; fi
              if [ -f verify-account.md ]; then cat verify-account.md; fi
              if [ -f audits.md ] && grep -q '^- FAIL' audits.md; then grep '^- FAIL\|^  - ' audits.md; fi
              if [ -f data-check.md ]; then grep -E '^- (FAIL|warning)' data-check.md || true; fi
              echo
              echo "Screenshots and the full report: the run's production-check artifact."
            } > issue.md
            scripts/report-issue.sh production-check "Production check failed" fail issue.md
          else
            scripts/report-issue.sh production-check "Production check failed" ok
          fi
