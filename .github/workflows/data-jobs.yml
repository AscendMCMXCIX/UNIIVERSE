# Runs the UNIIVERSE scheduler tick by calling the deployed app. It needs two repository secrets:
#   APP_URL      e.g. https://uniiverse.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET environment variable in Vercel
#
# Cadence: GitHub runs cron workflows on a best-effort basis (in this repository a "*/3 hours"
# schedule was delivered four to six times a day). Scheduled runs therefore only start the tick
# (`?background=1`: the app answers at once and works for up to four minutes on its own), so each
# run bills about one Actions minute. Hourly would be at most 720 minutes a month, but GitHub
# delivered 64 runs in 1-15 Oct 2026 (about 4.3 a day), so it costs about 130 (docs/CI_USAGE.md).
# The app also refreshes itself while the team uses it (a visit starts a background tick when none
# ran for 30 minutes) and Vercel's daily cron is a last fallback, so a missed run costs nothing.
# Manual runs (Run workflow) wait for the result and print it. Several jobs can share one manual
# run ("perf-probe auth-audit"): every run bills at least one minute, so one run with three jobs
# costs a third of three runs. "smoke" is the production smoke check (the same requests as
# smoke.yml, public endpoints only), so a post-deploy check is one run: "smoke perf-probe".
# GitHub also disables scheduled workflows after 60 days without commits; re-enable it under the
# Actions tab if that happens. Set the repository variable DATA_JOBS_ENABLED=false to pause it.
name: Data jobs

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Job or space-separated jobs to run, in order (smoke, tick, version-check, static-sync, account-sync, integrity, auth-audit, data-audit, db-usage, skin-audit, proficiency-audit, perf-probe, riot-check)"
        default: "tick"

jobs:
  tick:
    runs-on: ubuntu-latest
    # A scheduled run only starts the tick; a manual run waits for each job (up to ~5 minutes each).
    timeout-minutes: ${{ github.event_name == 'schedule' && 3 || 20 }}
    if: ${{ vars.DATA_JOBS_ENABLED != 'false' }}
    steps:
      - name: Call the job endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ github.event.inputs.job || 'tick' }}
          BACKGROUND: ${{ github.event_name == 'schedule' && '?background=1' || '' }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set; skipping."; exit 0; fi
          # The response lists every job that ran with its summary, error and last log lines.
          # Jobs run one after another (never in parallel), and the run fails if any of them fails.
          set -f -o pipefail
          status=0
          for job in $JOB; do
            case "$job" in *[!a-z-]*) echo "Unknown job name: $job"; status=1; continue ;; esac
            echo "== $job =="
            if [ "$job" = "smoke" ]; then
              curl --silent --show-error --max-time 60 "$APP_URL/api/health" | head -c 4000 || status=1
              echo
              for path in /login /team /players /overview /overview/blocks /ranked /me /settings /admin/players /api/jobs/tick; do
                printf "%-20s %s\n" "$path" "$(curl --silent --output /dev/null --max-time 60 -w "%{http_code} %{redirect_url} %{time_total}s" "$APP_URL$path")"
              done
              continue
            fi
            curl --fail --silent --show-error --max-time 290 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/jobs/$job$BACKGROUND" | head -c 64000 || status=1
            echo
          done
          exit $status
