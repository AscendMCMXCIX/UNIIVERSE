# Runs the UNIIVERSE scheduler tick by calling the deployed app. It needs two repository secrets:
#   APP_URL      e.g. https://uniiverse.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET environment variable in Vercel
#
# Cadence: GitHub runs cron workflows on a best-effort basis (in this repository a "*/3 hours"
# schedule was delivered four to six times a day). Scheduled runs therefore only start the tick
# (`?background=1`: the app answers at once and works for up to four minutes on its own), so each
# run bills about one Actions minute. Hourly would be at most 720 minutes a month, but GitHub
# delivered 64 runs in 1-15 Oct 2026 (about 4.3 a day), so it costs about 130 (docs/CI_USAGE.md).
# The app also refreshes itself while the team uses it (a visit starts a background tick when none
# ran for 30 minutes) and Vercel's daily cron is a last fallback, so a missed run costs nothing.
# Manual runs (Run workflow) wait for the result and print it. Several jobs can share one manual
# run ("perf-probe auth-audit"): every run bills at least one minute, so one run with three jobs
# costs a third of three runs. "smoke" is the production smoke check (the same requests as
# smoke.yml, public endpoints only); it fails when health is not ok or a page errors. A post-deploy
# check is one run: "smoke", with "perf-probe" when the change touched data loading (CLAUDE.md §5).
# "web" prints what a browser receives from production, public responses only: the security
# headers, the installable app's files (manifest, icons, service worker, offline page) and where
# signing out with no session sends the browser. It fails the run when one of them is missing.
# A scheduled run also reads /api/health and fails when production is unwell (the app or database
# down, a job failing three times in a row, or no account sync for 12 hours), or when yesterday's
# database egress went over its daily budget (the "egress" job), so GitHub's failed-workflow email
# is the alert (docs/MONITORING.md).
# GitHub also disables scheduled workflows after 60 days without commits; re-enable it under the
# Actions tab if that happens. Set the repository variable DATA_JOBS_ENABLED=false to pause it.
name: Data jobs

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Job or space-separated jobs to run, in order (smoke, web, tick, version-check, static-sync, account-sync, timeline-backfill, figures-backfill, integrity, erasure-reconcile, auth-audit, access-audit, data-audit, db-usage, egress, skin-audit, proficiency-audit, perf-probe, riot-check)"
        default: "tick"

jobs:
  tick:
    runs-on: ubuntu-latest
    # A scheduled run only starts the tick; a manual run waits for each job (up to ~5 minutes each).
    timeout-minutes: ${{ github.event_name == 'schedule' && 3 || 20 }}
    if: ${{ vars.DATA_JOBS_ENABLED != 'false' }}
    steps:
      - name: Call the job endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ github.event.inputs.job || 'tick' }}
          BACKGROUND: ${{ github.event_name == 'schedule' && '?background=1' || '' }}
          EVENT: ${{ github.event_name }}
          SYNC_STALE_HOURS: ${{ vars.SYNC_STALE_HOURS || '12' }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set; skipping."; exit 0; fi
          # The response lists every job that ran with its summary, error and last log lines.
          # Jobs run one after another (never in parallel), and the run fails if any of them fails.
          set -f -o pipefail
          status=0
          for job in $JOB; do
            case "$job" in *[!a-z-]*) echo "Unknown job name: $job"; status=1; continue ;; esac
            echo "== $job =="
            if [ "$job" = "web" ]; then
              # Response headers only: no cookie is sent, and none is printed.
              headers() { curl --silent --show-error --max-time 60 --output /dev/null --dump-header - "$@" | tr -d '\r'; }
              want() { if printf '%s\n' "$2" | grep -qiE "$3"; then echo "   ok      $1"; else echo "   MISSING $1"; status=1; fi; }
              for path in /login /api/health /manifest.webmanifest /sw.js /offline.html /icons/icon-192.png /icons/icon-512.png; do
                h="$(headers "$APP_URL$path")"
                echo "-- GET $path"
                printf '%s\n' "$h" | grep -iE '^(HTTP/|(content-type|cache-control|x-frame-options|x-content-type-options|referrer-policy|permissions-policy|content-security-policy|strict-transport-security):)' | sed 's/^/   /'
                want "answers 200" "$h" '^HTTP/[0-9.]+ 200'
                want "nosniff" "$h" '^x-content-type-options: *nosniff'
                case "$path" in
                  /login|/offline.html)
                    want "frame policy" "$h" '^x-frame-options: *sameorigin'
                    want "page policy" "$h" "^content-security-policy:.*frame-ancestors 'self'.*form-action 'self'" ;;
                  /manifest.webmanifest) want "manifest type" "$h" '^content-type: *application/manifest\+json' ;;
                  /sw.js)
                    want "never cached" "$h" '^cache-control: *no-cache'
                    want "script type" "$h" '^content-type: *application/javascript' ;;
                  /icons/*) want "image type" "$h" '^content-type: *image/png' ;;
                esac
              done
              echo "-- manifest"
              curl --silent --show-error --max-time 60 "$APP_URL/manifest.webmanifest" | head -c 1500; echo
              echo "-- offline page title: $(curl --silent --max-time 60 "$APP_URL/offline.html" | grep -o '<title>[^<]*</title>')"
              echo "-- POST /api/auth/logout with no session"
              h="$(headers -X POST "$APP_URL/api/auth/logout")"
              printf '%s\n' "$h" | grep -iE '^(HTTP/|location:)' | sed 's/^/   /'
              want "sign-out sends the browser to this site's public page" "$h" '^location: */$'
              continue
            fi
            if [ "$job" = "smoke" ]; then
              # Fails the run when production is not answering: health (app and database) not ok,
              # or a page that errors (5xx) or does not answer at all. Redirects to sign-in and the
              # jobs endpoint's 401 are the expected answers.
              health="$(curl --silent --show-error --max-time 60 "$APP_URL/api/health" || true)"
              printf '%s' "$health" | head -c 4000; echo
              if ! printf '%s' "$health" | jq -e '.ok == true and .db.ok == true' >/dev/null 2>&1; then
                echo "::error::Smoke: /api/health is not ok"; status=1
              fi
              for path in /login /team /players /overview /me /settings /admin/players /api/jobs/tick; do
                out="$(curl --silent --output /dev/null --max-time 60 -w "%{http_code} %{redirect_url} %{time_total}s" "$APP_URL$path" || true)"
                printf "%-24s %s\n" "$path" "$out"
                case "${out%% *}" in
                  5*|000|"") echo "::error::Smoke: $path answered ${out%% *}"; status=1 ;;
                esac
              done
              # Ranked Development is retired: its addresses (and those of Solo Queue Blocks and the
              # Ranked Improvement journal before it) redirect to My Profile's Overview.
              for path in /overview/development /overview/blocks /blocks /ranked; do
                out="$(curl --silent --output /dev/null --max-time 60 -w "%{http_code} %{redirect_url}" "$APP_URL$path" || true)"
                printf "%-24s %s\n" "$path" "$out"
                case "$out" in
                  30[78]" "*/overview) ;;
                  *) echo "::error::Smoke: $path does not redirect to /overview"; status=1 ;;
                esac
              done
              continue
            fi
            curl --fail --silent --show-error --max-time 290 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/jobs/$job$BACKGROUND" | head -c 64000 || status=1
            echo
          done
          # A scheduled run also fails when production is unwell, so GitHub's failed-workflow email
          # reaches the owner (docs/MONITORING.md): the app or its database not answering, a job
          # failing three times in a row, or no successful account sync for SYNC_STALE_HOURS.
          if [ "$EVENT" = "schedule" ]; then
            health="$(curl --silent --max-time 60 "$APP_URL/api/health" || true)"
            problem="$(printf '%s' "$health" | jq -r --argjson hours "$SYNC_STALE_HOURS" '
              if .ok != true then "the app or its database is not answering"
              elif (.failingJobs | length) > 0 then "failing jobs: " + (.failingJobs | join(", "))
              else ([.jobs[] | select(.key == "account-sync") | .lastSuccessAt][0]) as $at
                | if $at != null and (now - ($at | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601)) > $hours * 3600
                  then "no successful account sync for over \($hours) hours" else empty end
              end' 2>/dev/null || echo "the health check could not be read")"
            [ -n "$health" ] || problem="the health check could not be read"
            if [ -n "$problem" ]; then echo "::error::Production health: $problem"; status=1; else echo "Production health: ok"; fi
            # Database egress: yesterday's estimate, counted by the app, against the daily budget
            # (docs/HOSTING_USAGE.md). Over budget fails the run, so the same email arrives. A
            # deployment without the check yet (404) is a warning, not a failure.
            egress="$(curl --silent --max-time 60 -H "Authorization: Bearer $CRON_SECRET" -w '\n%{http_code}' "$APP_URL/api/jobs/egress" || true)"
            code="$(printf '%s' "$egress" | tail -n 1)"
            line="$(printf '%s' "$egress" | sed '$d' | jq -r 'if .ok == true then "Database egress on \(.summary.yesterday): \(.summary.yesterdayMb) MB (budget \(.summary.budgetMbPerDay) MB a day)" else "::error::\(.error // "the egress check failed")" end' 2>/dev/null || true)"
            if [ "$code" = "404" ]; then echo "::warning::The egress check is not on this deployment yet."
            elif [ -z "$line" ]; then echo "::error::The egress check could not be read (HTTP $code)."; status=1
            else echo "$line"; case "$line" in ::error::*) status=1 ;; esac; fi
          fi
          exit $status
