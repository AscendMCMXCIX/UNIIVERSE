# Runs the UNIIVERSE scheduler tick on a schedule by calling the deployed app.
# This is the recommended way to get frequent data updates on Vercel's free (Hobby) plan,
# whose built-in cron only runs once per day. It needs two repository secrets:
#   APP_URL      e.g. https://uniiverse.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET environment variable in Vercel
# Note: GitHub disables scheduled workflows after 60 days without commits; UNIIVERSE itself
# keeps working, only the frequent refreshes stop until you push again or re-enable the workflow.
name: Data jobs

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run (tick, version-check, static-sync, ranked-discover, ranked-ingest, aggregate, pro-sync, integrity)"
        default: "tick"

jobs:
  tick:
    runs-on: ubuntu-latest
    if: ${{ vars.DATA_JOBS_ENABLED != 'false' }}
    steps:
      - name: Call the job endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ github.event.inputs.job || 'tick' }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set; skipping."; exit 0; fi
          curl --fail --silent --show-error --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/jobs/$JOB" | head -c 4000; echo
