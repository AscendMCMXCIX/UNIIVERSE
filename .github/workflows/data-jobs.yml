# Runs the UNIIVERSE scheduler tick by calling the deployed app. It needs two repository secrets:
#   APP_URL      e.g. https://uniiverse.vercel.app
#   CRON_SECRET  the same value as the CRON_SECRET environment variable in Vercel
#
# Cadence: GitHub runs cron workflows on a best-effort basis. In this repository a "*/10" schedule
# fired only four to five times a day, and a private repository has 2,000 free Actions minutes a
# month, which a four-minute tick every ten minutes would exhaust in days. Every three hours is
# sustainable (about 40 minutes a day) and keeps patches, pro data and a baseline of ranked games
# fresh. For ten-minute refreshes use Supabase pg_cron or another pinger (docs/DEPLOYMENT.md §4).
# GitHub also disables scheduled workflows after 60 days without commits; re-enable it under the
# Actions tab if that happens. Set the repository variable DATA_JOBS_ENABLED=false to pause it.
name: Data jobs

on:
  schedule:
    - cron: "13 */3 * * *"
  workflow_dispatch:
    inputs:
      job:
        description: "Job to run (tick, version-check, static-sync, ranked-discover, ranked-ingest, aggregate, pro-sync, account-sync, integrity, auth-audit, perf-probe, riot-check)"
        default: "tick"

jobs:
  tick:
    runs-on: ubuntu-latest
    if: ${{ vars.DATA_JOBS_ENABLED != 'false' }}
    steps:
      - name: Call the job endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          JOB: ${{ github.event.inputs.job || 'tick' }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL / CRON_SECRET secrets are not set; skipping."; exit 0; fi
          # The response lists every job that ran with its summary, error and last log lines.
          curl --fail --silent --show-error --max-time 290 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/jobs/$JOB" | head -c 16000; echo
