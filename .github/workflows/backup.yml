# Weekly encrypted backup of the production database, proved by restoring it (docs/BACKUPS.md).
# It needs two repository secrets, which the owner creates:
#   BACKUP_DATABASE_URL  Supabase's session pooler (port 5432) for the read-only uniiverse_backup role;
#                        the script checks that role can read every table and change none
#   BACKUP_PASSPHRASE    a long random passphrase, also kept in the owner's password manager: without
#                        it no backup can be opened
# Each run dumps the public schema, restores it into a throw-away Postgres on the runner and compares
# row counts with production, encrypts it (AES-256) and keeps it 28 days as an artifact of
# the run. It costs about 3 Actions minutes a week. Its manifest alone (sizes, row counts and
# checksums: no data, no secret) is kept 90 days as a second artifact, so the backup's growth can be
# followed. A failed run, or a backup over 80% of MAX_MB, opens one issue labelled database-backup
# (or comments on the open one); the next healthy run closes it (scripts/report-issue.sh). GitHub's
# failed-workflow email still arrives too. The daily Production check fails when no backup has
# passed for 8 days.
name: Database backup

on:
  schedule:
    - cron: "43 2 * * 1"
  workflow_dispatch:
    inputs:
      max_mb:
        description: "Fail when the encrypted backup is larger than this many MB (100 keeps four weekly copies well inside GitHub Pro's 1 GB of artifact storage)"
        type: number
        default: 100

permissions:
  contents: read
  issues: write

concurrency:
  group: database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # pg_dump must be at least the server's major version (access-audit reports serverVersion).
      PG_MAJOR: "17"
    services:
      # Throw-away server for the restore check; never production.
      restore:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: restore-check
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install the PostgreSQL client tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-$PG_MAJOR"
          echo "/usr/lib/postgresql/$PG_MAJOR/bin" >> "$GITHUB_PATH"
      - name: Back up, check the restore, encrypt
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          RESTORE_SERVER_URL: postgres://postgres:restore-check@127.0.0.1:5433
          OUT_DIR: backup
          # Scheduled runs: 100. A run by hand may allow more once, e.g. the last backup before the
          # retired tables are dropped (docs/BACKUPS.md).
          MAX_MB: ${{ inputs.max_mb || 100 }}
        run: |
          # A backup that silently skips is worse than a failed run, so missing secrets fail it.
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "The BACKUP_DATABASE_URL and BACKUP_PASSPHRASE secrets are not set (docs/BACKUPS.md)."; exit 1; fi
          scripts/backup-db.sh
      - uses: actions/upload-artifact@v7
        with:
          name: database-backup-${{ github.run_id }}
          path: backup/
          retention-days: 28
          compression-level: 0
          if-no-files-found: error
      # The backup's size against its limit, and the counts it proved: in the run's summary, and the
      # manifest kept longer on its own (no data in it).
      - name: Size and growth
        id: size
        env:
          MAX_MB: ${{ inputs.max_mb || 100 }}
        run: |
          manifest="$(ls backup/*.json | head -n 1)"
          mb=$(( $(jq -r '.encryptedBytes' "$manifest") / 1048576 ))
          pct=$(( mb * 100 / MAX_MB ))
          {
            echo "## Database backup"
            echo "- Encrypted size: $mb MB, $pct% of the $MAX_MB MB limit."
            echo "- Rows proved in the restored copy: $(jq -c '.rows' "$manifest")"
            echo "- Retired tables' rows proved: $(jq -c '.retiredTableRows // {}' "$manifest")"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "mb=$mb" >> "$GITHUB_OUTPUT"
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          if [ "$pct" -ge 80 ]; then echo "::warning::The encrypted backup is $mb MB, $pct% of its $MAX_MB MB limit (docs/BACKUPS.md: drop the retired tables, or raise max_mb)."; fi
      - uses: actions/upload-artifact@v7
        with:
          name: database-backup-manifest-${{ github.run_id }}
          path: backup/*.json
          retention-days: 90
          if-no-files-found: error
      - name: Report
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FAILED: ${{ job.status == 'failure' }}
          MB: ${{ steps.size.outputs.mb }}
          PCT: ${{ steps.size.outputs.pct }}
        run: |
          if [ "$FAILED" = "true" ]; then
            printf '%s\n\n%s\n' "The weekly database backup failed: $RUN_URL" "The run's log says which check stopped it (the role, the dump, the restore counts, the encryption or the size). No backup was kept from this run; the previous ones are still in their runs for 28 days." > issue.md
            scripts/report-issue.sh database-backup "Database backup needs attention" fail issue.md
          elif [ -n "$PCT" ] && [ "$PCT" -ge 80 ]; then
            printf '%s\n\n%s\n' "The database backup passed, but it is $MB MB: $PCT% of its size limit ($RUN_URL)." "A run by hand can allow more (max_mb). The next engineering session reads Data jobs db-usage and proposes what to reduce (docs/HOSTING_USAGE.md); deleting stored data needs your approval. Nothing has failed yet." > issue.md
            scripts/report-issue.sh database-backup "Database backup needs attention" fail issue.md
          else
            scripts/report-issue.sh database-backup "Database backup needs attention" ok
          fi
