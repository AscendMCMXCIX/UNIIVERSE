# Production smoke check: asks the deployed app which build is live and confirms that the public
# pages answer, that private pages still redirect anonymous visitors to the sign-in page, and that
# the retired Ranked Development addresses lead to /overview.
# Reads only public endpoints; needs the APP_URL repository secret (same as data-jobs.yml).
name: Production smoke

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe the deployed app
        env:
          APP_URL: ${{ secrets.APP_URL }}
        run: |
          if [ -z "$APP_URL" ]; then echo "APP_URL secret is not set; skipping."; exit 0; fi
          echo "== /api/health =="
          curl --silent --show-error --max-time 60 "$APP_URL/api/health" | head -c 4000; echo
          status() { curl --silent --output /dev/null --max-time 60 -w "%{http_code} %{redirect_url} %{time_total}s" "$APP_URL$1"; }
          for path in /login /team /players /overview /me /settings /admin/players /api/jobs/tick; do
            printf "%-24s %s\n" "$path" "$(status "$path")"
          done
          echo "== retired Ranked Development addresses (expected: a redirect to /overview) =="
          for path in /overview/development /overview/blocks /blocks /ranked; do
            printf "%-24s %s\n" "$path" "$(status "$path")"
          done
