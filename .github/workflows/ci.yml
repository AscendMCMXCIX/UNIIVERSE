name: CI

# Actions minutes are limited (2,000 a month on the free plan, shared with data-jobs.yml), so:
# - pull requests are checked once, on the pull_request event, and main once per push. Pushes to
#   other branches no longer run CI on their own: open a PR, or start a run by hand
#   (Actions → CI → Run workflow). Before this, every commit on a PR branch ran CI twice (push
#   and pull_request events, in different concurrency groups).
# - changes that cannot affect the build (documentation, the production-only workflows and the
#   by-hand WebKit workflow) do not start CI.
# - a newer push to the same PR or branch cancels the run it supersedes.
# - the browser and database suites wait for typecheck, lint and unit tests, so a broken commit
#   stops after about two minutes instead of also running the 10-minute browser suite.
# - draft pull requests are not checked; marking one "Ready for review" runs CI.
# - after a pull request is merged, the push to main reuses its result when main now holds exactly
#   the source tree that already passed every job (the PR was up to date with main). Each passing
#   job leaves a small marker artifact named after the tree it tested; the push run looks the
#   markers up and skips the suites, so a merge costs about a minute instead of a second full run.
#   If main moved in between, the merged tree is new and the full CI runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".env.example"
      - ".github/workflows/data-jobs.yml"
      - ".github/workflows/probe.yml"
      - ".github/workflows/smoke.yml"
      - ".github/workflows/webkit.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".env.example"
      - ".github/workflows/data-jobs.yml"
      - ".github/workflows/probe.yml"
      - ".github/workflows/smoke.yml"
      - ".github/workflows/webkit.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, unit tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      # Push to main: did this exact source tree already pass the database and browser jobs (as a
      # pull request's merge result)? Any doubt (API error, missing or expired marker) runs CI.
      - id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          found() {
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$TREE-$1&per_page=10" \
              | jq -e '[.artifacts[] | select(.expired | not)] | length > 0' >/dev/null
          }
          if [ -n "$TREE" ] && found db && found e2e; then
            echo "Tree $TREE already passed every CI job in a pull request run; skipping the suites."
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "No passing run of tree ${TREE:-?} found; running the full CI."
          fi
      - if: steps.tested.outputs.tested != 'true'
        uses: actions/checkout@v7
      # pnpm version comes from the "packageManager" field in package.json.
      - if: steps.tested.outputs.tested != 'true'
        uses: pnpm/action-setup@v6
      - if: steps.tested.outputs.tested != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: steps.tested.outputs.tested != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.tested.outputs.tested != 'true'
        run: pnpm typecheck
      - if: steps.tested.outputs.tested != 'true'
        run: pnpm lint
      # Unit tests only. The database suite (tests/db) runs once, on PostgreSQL 16 below: the
      # production engine. The in-memory PGlite engine is exercised end to end by the browser
      # tests, and `pnpm test` still runs the database suite on PGlite locally.
      - if: steps.tested.outputs.tested != 'true'
        run: pnpm vitest run src

  postgres:
    name: Database tests on PostgreSQL 16
    needs: check
    if: needs.check.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uniiverse
          POSTGRES_PASSWORD: uniiverse
          POSTGRES_DB: uniiverse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uniiverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every database test gets a throw-away database on a real Postgres server: production
      # driver, transaction-scoped migration lock and real SQL.
      - run: pnpm vitest run tests/db
        env:
          TEST_DATABASE_URL: postgres://uniiverse:uniiverse@127.0.0.1:5432/uniiverse
      # Marker: this source tree passed the database suite (read by a later push to main).
      - id: tree
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo ok > "$RUNNER_TEMP/ci-passed"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-passed-${{ steps.tree.outputs.tree }}-db
          path: ${{ runner.temp }}/ci-passed
          retention-days: 5
          overwrite: true

  e2e:
    name: Build and browser tests (Playwright)
    needs: check
    if: needs.check.outputs.tested != 'true'
    runs-on: ubuntu-latest
    # The suite takes 23 to 28 minutes (docs/CI_USAGE.md). A run that hits the limit fails and costs
    # a whole re-run; the limit itself costs nothing unless a run hangs.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Chromium download is cached per Playwright version; system libraries are installed
      # either way (they are not cacheable).
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # The production build is checked here (once per run) and then served to the tests.
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Phone, tablet and desktop against the production build on an in-memory database.
      - run: pnpm test:e2e
        env:
          CI: "true"
      # Marker: this source tree passed the build and browser tests (read by a later push to main).
      - id: tree
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo ok > "$RUNNER_TEMP/ci-passed"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-passed-${{ steps.tree.outputs.tree }}-e2e
          path: ${{ runner.temp }}/ci-passed
          retention-days: 5
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
