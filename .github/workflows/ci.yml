name: CI

# CI stays small and fast (public since 6 Nov 2026, so standard runners are not billed; the rules keep the queue short), so:
# - pull requests are checked once, on the pull_request event, and main once per push. Pushes to
#   other branches no longer run CI on their own: open a PR, or start a run by hand
#   (Actions → CI → Run workflow). Before this, every commit on a PR branch ran CI twice (push
#   and pull_request events, in different concurrency groups).
# - changes that cannot affect the build (documentation, the production-only workflows, the
#   by-hand WebKit workflow and the workflow lint) do not start CI.
# - a newer push to the same PR or branch cancels the run it supersedes.
# - the browser and database suites wait for typecheck, lint and unit tests, so a broken commit
#   stops after about two minutes instead of also running the 10-minute browser suite.
# - draft pull requests are not checked; marking one "Ready for review" runs CI.
# - after a pull request is merged, the push to main reuses its result when main now holds exactly
#   the source tree that already passed every job (the PR was up to date with main). Each passing
#   job leaves a small marker artifact named after the tree it tested; the push run looks the
#   markers up and skips the suites, so a merge costs about a minute instead of a second full run.
#   If main moved in between, the merged tree is new and the full CI runs.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".env.example"
      - ".github/workflows/data-jobs.yml"
      - ".github/workflows/probe.yml"
      - ".github/workflows/smoke.yml"
      - ".github/workflows/webkit.yml"
      - ".github/workflows/production-check.yml"
      - ".github/workflows/workflow-lint.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".env.example"
      - ".github/workflows/data-jobs.yml"
      - ".github/workflows/probe.yml"
      - ".github/workflows/smoke.yml"
      - ".github/workflows/webkit.yml"
      - ".github/workflows/production-check.yml"
      - ".github/workflows/workflow-lint.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint, unit tests
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      # Push to main: did this exact source tree already pass the database and browser jobs (as a
      # pull request's merge result)? Any doubt (API error, missing or expired marker) runs CI.
      # Only a marker from a run of this repository's own branches counts: the repository is
      # public, and a fork's pull request runs its own copy of this workflow, which could upload one.
      - id: tested
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TREE: ${{ github.event.head_commit.tree_id }}
        run: |
          found() {
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts?name=ci-passed-$TREE-$1&per_page=10" \
              | jq -e '[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length > 0' >/dev/null
          }
          if [ -n "$TREE" ] && found db && found e2e; then
            echo "Tree $TREE already passed every CI job in a pull request run; skipping the suites."
            echo "tested=true" >> "$GITHUB_OUTPUT"
          else
            echo "No passing run of tree ${TREE:-?} found; running the full CI."
          fi
      - if: steps.tested.outputs.tested != 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # pnpm version comes from the "packageManager" field in package.json.
      - if: steps.tested.outputs.tested != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: steps.tested.outputs.tested != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: steps.tested.outputs.tested != 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.tested.outputs.tested != 'true'
        run: pnpm typecheck
      - if: steps.tested.outputs.tested != 'true'
        run: pnpm lint
      # Unit tests only. The database suite (tests/db) runs once, on PostgreSQL 16 below: the
      # production engine. The in-memory PGlite engine is exercised end to end by the browser
      # tests, and `pnpm test` still runs the database suite on PGlite locally.
      - if: steps.tested.outputs.tested != 'true'
        run: pnpm vitest run src

  postgres:
    name: Database tests on PostgreSQL 16
    needs: check
    if: needs.check.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uniiverse
          POSTGRES_PASSWORD: uniiverse
          POSTGRES_DB: uniiverse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U uniiverse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every database test gets a throw-away database on a real Postgres server: production
      # driver, transaction-scoped migration lock and real SQL.
      - run: pnpm vitest run tests/db
        env:
          TEST_DATABASE_URL: postgres://uniiverse:uniiverse@127.0.0.1:5432/uniiverse
      # Marker: this source tree passed the database suite (read by a later push to main).
      - id: tree
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo ok > "$RUNNER_TEMP/ci-passed"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-passed-${{ steps.tree.outputs.tree }}-db
          path: ${{ runner.temp }}/ci-passed
          retention-days: 5
          overwrite: true

  e2e:
    # The browser suite in four parallel shards (19 Nov 2026, the owner's request to speed up CI:
    # one job took 40-54 minutes of its 60). Each shard builds the app once and runs a quarter of the
    # spec files against its own in-memory demo, so a shard's specs never see another shard's data.
    # The job below, under the old name, reports the four together and leaves the tree's marker.
    name: Browser tests (shard ${{ matrix.shard }} of 4)
    needs: check
    if: needs.check.outputs.tested != 'true'
    runs-on: ubuntu-latest
    # A shard takes about a quarter of the suite plus the build (about 15-20 minutes). Installing the
    # browser's system libraries once stalled for 14 (docs/CI_USAGE.md); the limit costs nothing
    # unless a run hangs.
    timeout-minutes: 45
    strategy:
      # Every shard finishes, so one run shows every failure, not only the first shard's.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Chromium download is cached per Playwright version; system libraries are installed
      # either way (they are not cacheable).
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # The production build is checked in every shard and then served to its tests.
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # Phone, tablet and desktop against the production build on an in-memory database.
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
        env:
          CI: "true"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: test-results
          retention-days: 7

  e2e-result:
    # The four shards together, under the job name the merge checks read: it passes only when every
    # shard passed, and then leaves the marker a later push to main reads (the tree passed the build
    # and the browser tests).
    name: Build and browser tests (Playwright)
    needs: [check, e2e]
    if: always() && needs.check.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.e2e.result != 'success'
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          echo "::error::The browser-test shards did not all pass (result: $RESULT)."
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: tree
        run: |
          echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          echo ok > "$RUNNER_TEMP/ci-passed"
      - uses: actions/upload-artifact@v7
        with:
          name: ci-passed-${{ steps.tree.outputs.tree }}-e2e
          path: ${{ runner.temp }}/ci-passed
          retention-days: 5
          overwrite: true

  webkit:
    # Safari's engine on every pull request, in parallel with the browser shards (19 Nov 2026: it was
    # a workflow started by hand for each head; .github/workflows/webkit.yml stays for branches with no
    # pull request). Same steps and limit as that workflow, and the same job name, which the merge
    # checks read. Not on the push to main: the pull request's run covered the same tree.
    name: Safari's engine (WebKit) on the priority pages
    needs: check
    if: github.event_name == 'pull_request' && needs.check.outputs.tested != 'true'
    # Ubuntu 24.04, not ubuntu-latest (26.04): Playwright 1.58.2, whose WebKit 26.0 the Safari 26
    # step needs, has no WebKit for 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-ubuntu-24.04-${{ steps.playwright.outputs.version }}-webkit
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps webkit
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps webkit
      - id: build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - run: pnpm exec playwright test --project=webkit
        env:
          CI: "true"
          E2E_WEBKIT: "1"
      # Safari 26 (iOS, iPadOS and macOS 26): Playwright 1.58.2's WebKit 26.0, as in webkit.yml.
      - name: Safari 26's engine (WebKit 26.0) on every kind of window
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/pw26/browsers
          PW26_CORE: ${{ runner.temp }}/pw26/node_modules/playwright-core
          WEBKIT26_SHOTS: test-results/webkit26
        run: |
          npm install --prefix "$RUNNER_TEMP/pw26" --no-audit --no-fund playwright-core@1.58.2
          node "$PW26_CORE/cli.js" install --with-deps webkit
          node scripts/webkit26-check.mjs
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: webkit-traces
          path: test-results
          retention-days: 7
